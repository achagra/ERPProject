security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_provider:
            entity:
                class: App\Entity\Users
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_provider
            form_login:
                login_path: app_login
                check_path: app_login
                   # ← Ajout important
                # default_target_path: app_home                     # ← Tu peux le supprimer ou le laisser
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/facture-public, roles: PUBLIC_ACCESS }
        - { path: ^/super-admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/dashbord, roles: ROLE_ADMIN }
        - { path: ^/user, roles: ROLE_ADMIN }
        - { path: ^/employe, roles: ROLE_ADMIN }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10